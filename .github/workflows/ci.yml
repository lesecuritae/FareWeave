name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tool/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r tool/requirements.txt
      - name: Run deterministic regression suite
        run: bash scripts/check.sh
