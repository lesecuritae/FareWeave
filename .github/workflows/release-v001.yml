name: Create FareWeave v0.0.1 release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create v0.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          cat > /tmp/release-notes.md <<'EOF'
          Erste öffentliche Version von FareWeave.

          FareWeave ist ein selbst gehosteter Reisevergleich mit Fokus auf Reisen aus Deutschland. Integriert sind unter anderem Deutsche Bahn, Deutschlandticket, Split-Ticketing, FlixTrain, FlixBus, Flugvergleiche, Transfers und Unterkünfte. Die Reiseplanung selbst arbeitet deterministisch ohne KI-Entscheidung.

          FareWeave plant und vergleicht. Gebucht wird anschließend beim jeweiligen Anbieter über die ausgegebenen Links.

          Installation, bekannte Einschränkungen, verwendete Provider und Lizenzhinweise stehen im README und in THIRD_PARTY.md.
          EOF
          gh release create v0.0.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target 6d8e5bfe13da3dd0f23f96c6265d15d1243e667c \
            --title "FareWeave 0.0.1" \
            --notes-file /tmp/release-notes.md
