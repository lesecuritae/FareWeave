name: Import FareWeave source from temporary archive

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Replace bootstrap with FareWeave 0.0.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://filebin.net/fareweave-import-20260812-3f7c9a/fareweave-src.tgz" -o /tmp/fareweave.tgz
          mkdir -p /tmp/fareweave
          tar -xzf /tmp/fareweave.tgz -C /tmp/fareweave
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/fareweave/. .
          sed -i 's/selbst gehosteter, Reisevergleich/selbst gehosteter Reisevergleich/' README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish FareWeave 0.0.1"
          git push origin HEAD:main
