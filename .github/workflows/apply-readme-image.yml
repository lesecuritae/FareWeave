name: Apply FareWeave README image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Rebuild and apply light README hero
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          import shutil

          parts = [
              'tmp-readme-image/part-00',
              'tmp-readme-image/part-01-02',
              'tmp-readme-image/part-03-04',
              'tmp-readme-image/part-05-06',
              'tmp-readme-image/part-07-08',
              'tmp-readme-image/part-09-10',
              'tmp-readme-image/part-11',
          ]
          payload = bytes.fromhex(''.join(Path(p).read_text().strip() for p in parts))
          expected = 'b88485d87318488377a8a9fc6641d43d9f35eddc223c784a21797fb57bec888d'
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f'Hero image SHA256 mismatch: {actual}')

          out = Path('docs/assets/readme-hero.jpg')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(payload)

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('docs/assets/readme-hero.svg', 'docs/assets/readme-hero.jpg')
          readme.write_text(text, encoding='utf-8')

          old = Path('docs/assets/readme-hero.svg')
          if old.exists():
              old.unlink()
          shutil.rmtree('tmp-readme-image')
          print('Hero image SHA256:', actual)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use light FareWeave README hero"
          git push origin HEAD:main
