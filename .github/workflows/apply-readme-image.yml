name: Apply FareWeave README image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Rebuild and apply light README hero
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d tmp-readme-image ]; then
            echo "Temporary image chunks already removed; nothing to do."
            exit 0
          fi
          python3 <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import shutil

          parts = [Path('tmp-readme-image/base64-test2')]
          parts += [Path(f'tmp-readme-image/b64-{i:02d}') for i in range(1, 12)]
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          payload = base64.b64decode(encoded, validate=True)

          expected = 'cf92a16365ccfef9b2cf412cc78905ec4b20266c041b99d24566aec4122b6b8f'
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f'Hero image SHA256 mismatch: {actual}')

          out = Path('docs/assets/readme-hero.webp')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(payload)

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('docs/assets/readme-hero.svg', 'docs/assets/readme-hero.webp')
          readme.write_text(text, encoding='utf-8')

          old = Path('docs/assets/readme-hero.svg')
          if old.exists():
              old.unlink()

          shutil.rmtree('tmp-readme-image')
          print('Hero image SHA256:', actual)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use light FareWeave README hero"
          git push origin HEAD:main
