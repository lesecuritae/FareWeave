name: Convert FareWeave README hero to JPG

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
      - name: Convert README hero
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/assets/readme-hero.webp
          convert docs/assets/readme-hero.webp -quality 92 docs/assets/readme-hero.jpg
          test -s docs/assets/readme-hero.jpg
          file docs/assets/readme-hero.jpg | grep -q 'JPEG image data'
          sed -i 's#docs/assets/readme-hero\.webp#docs/assets/readme-hero.jpg#g' README.md
          rm docs/assets/readme-hero.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/assets/readme-hero.jpg docs/assets/readme-hero.webp
          git commit -m "Use JPG for FareWeave README hero"
          git push origin HEAD:main
